[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-360-pipeline"
version = "1.0.0"
description = "Deterministic Customer 360 & Entity Resolution Pipeline"
authors = [{ name = "Data Engineering Team" }]
dependencies = [
    "pandas>=2.0.0",
    "duckdb>=1.0.0",
    "pyarrow>=14.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
